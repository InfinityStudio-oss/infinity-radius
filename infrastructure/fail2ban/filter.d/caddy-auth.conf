# Fail2ban filter for Caddy's default JSON access log, matching requests
# the Network Agent rejected as unauthorized (401 — bad/replayed HMAC
# signature) or forbidden (403 — source IP outside the allowlist).
# Copy to /etc/fail2ban/filter.d/caddy-auth.conf.

[Definition]
failregex = ^.*"remote_ip":"<HOST>".*"status":40[13].*$
ignoreregex =
