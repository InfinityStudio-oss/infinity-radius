[project]
name = "infinity-radius-network-agent"
version = "0.1.0"
description = "Infinity Radius — Network Agent. Runs on the Network VPS; the only component that speaks to MikroTik routers directly (over WireGuard)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "routeros-api>=0.19,<1.0",
  "python-dotenv>=1.0,<2.0",
  "pyyaml>=6.0,<7.0",
  "structlog>=24.4,<25.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "httpx2>=2.0,<3.0",
  "types-PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Header()/... are designed to be called in argument
# defaults — that's the framework's dependency-injection idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["routeros_api.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
