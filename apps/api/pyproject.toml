[project]
name = "infinity-radius-api"
version = "0.1.0"
description = "Infinity Radius — FastAPI backend (tenant API, RADIUS/router orchestration, billing)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "asyncpg>=0.30,<1.0",
  "celery>=5.4,<6.0",
  "redis>=5.2,<6.0",
  "httpx>=0.27,<1.0",
  "httpx2>=2.0,<3.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "structlog>=24.4,<25.0",
  "email-validator>=2.2,<3.0",
  "resend>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Query()/... are designed to be called in argument
# defaults — that's the framework's dependency-injection idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "resend.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
